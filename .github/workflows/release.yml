name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.2)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    strategy:
      matrix:
        include:
          - arch: x64
            msvc_arch: x64
            preset: default
            build_dir: build
            build_tests: 'ON'
            build_viewer: 'ON'
            rust_target: x86_64-pc-windows-msvc
          - arch: x86
            msvc_arch: amd64_x86
            preset: x86
            build_dir: build-x86
            build_tests: 'OFF'
            build_viewer: 'OFF'
            rust_target: i686-pc-windows-msvc
          - arch: arm64
            msvc_arch: amd64_arm64
            preset: arm64
            build_dir: build-arm64
            build_tests: 'OFF'
            build_viewer: 'OFF'
            rust_target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3

      - name: Install Windows App SDK (for WinUI3 C++/WinRT headers)
        run: nuget install Microsoft.WindowsAppSDK -Version 1.5.240607001 -OutputDirectory packages

      # The MCP server is a Rust staticlib linked into lvt.exe, so its target
      # has to match the C++ one on every leg of the matrix. All three are
      # Rust Tier 1, so no cross-compilation setup beyond the target itself.
      - name: Set up Rust (for the MCP server)
        run: rustup target add ${{ matrix.rust_target }}

      - name: Set up .NET 10 (for the x64 viewer)
        if: matrix.build_viewer == 'ON'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Tests only run on x64, and gtest now sits behind a vcpkg manifest
      # feature, so the other legs can skip building it entirely.
      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }}
          -DCMAKE_BUILD_TYPE=Release
          -DLVT_BUILD_TESTS=${{ matrix.build_tests }}
          -DLVT_BUILD_VIEWER=${{ matrix.build_viewer }}
          -DLVT_ENABLE_MCP=ON

      - name: Build managed WPF assembly
        run: msbuild src/tap_wpf/LvtWpfTap.csproj /p:Configuration=Release /p:Platform=AnyCPU /restore /v:minimal

      - name: Build managed WinForms assembly
        run: dotnet build src/tap_winforms/LvtWinFormsTap.csproj -c Release --nologo

      - name: Build managed Avalonia tree walker
        run: dotnet build src/plugin_avalonia/LvtAvaloniaTreeWalker/LvtAvaloniaTreeWalker.csproj -c Release

      - name: Build
        run: cmake --build ${{ matrix.build_dir }}

      - name: Validate build outputs
        run: |
          .\scripts\validate-release-package.ps1 `
            -Root ${{ matrix.build_dir }} `
            -Architecture ${{ matrix.arch }} `
            -PackageMode CLI `
            -Layout Build
          if ('${{ matrix.build_viewer }}' -eq 'ON') {
            .\scripts\validate-release-package.ps1 `
              -Root ${{ matrix.build_dir }}\viewer `
              -Architecture ${{ matrix.arch }} `
              -PackageMode Viewer `
              -Layout Build
          }

      - name: Unit tests
        if: matrix.arch == 'x64'
        run: ${{ matrix.build_dir }}\lvt_unit_tests.exe

      - name: Chromium plugin tests
        if: matrix.arch == 'x64'
        run: ${{ matrix.build_dir }}\lvt_chromium_tests.exe

      - name: Integration tests
        if: matrix.arch == 'x64'
        run: ${{ matrix.build_dir }}\lvt_integration_tests.exe

      - name: Package
        run: |
          Remove-Item release -Recurse -Force -ErrorAction Ignore
          New-Item -ItemType Directory -Path release -Force
          Copy-Item ${{ matrix.build_dir }}\lvt.exe release\
          Copy-Item ${{ matrix.build_dir }}\lvt_tap_${{ matrix.arch }}.dll release\
          Copy-Item ${{ matrix.build_dir }}\lvt_wpf_tap_${{ matrix.arch }}.dll release\
          Copy-Item ${{ matrix.build_dir }}\LvtWpfTap.dll release\
          Copy-Item ${{ matrix.build_dir }}\LvtWpfTap.runtimeconfig.json release\
          Copy-Item ${{ matrix.build_dir }}\lvt_winforms_tap_${{ matrix.arch }}.dll release\
          Copy-Item ${{ matrix.build_dir }}\LvtWinFormsTap.dll release\
          Copy-Item ${{ matrix.build_dir }}\LvtWinFormsTap.runtimeconfig.json release\
          Copy-Item -Recurse ${{ matrix.build_dir }}\plugins release\plugins
          New-Item -ItemType Directory -Path release\skills\lvt -Force
          Copy-Item .github\skills\lvt\SKILL.md release\skills\lvt\
          .\scripts\validate-release-package.ps1 `
            -Root release `
            -Architecture ${{ matrix.arch }} `
            -PackageMode CLI `
            -Layout Package
          Compress-Archive -Path release\* -DestinationPath lvt-${{ env.RELEASE_TAG }}-${{ matrix.arch }}.zip

      # Keep the normal CLI archive lean. The viewer has a .NET Desktop
      # Runtime dependency and is published as a separate, version-matched
      # x64 asset. It still includes the complete matching lvt runtime so
      # users never have to combine two archives by hand.
      - name: Package viewer
        if: matrix.build_viewer == 'ON'
        run: |
          Remove-Item viewer-release -Recurse -Force -ErrorAction Ignore
          New-Item -ItemType Directory -Path viewer-release -Force
          Copy-Item -Recurse ${{ matrix.build_dir }}\viewer\* viewer-release\
          Copy-Item src\viewer\RELEASE-README.txt viewer-release\README.txt
          Copy-Item LICENSE viewer-release\
          # Debug symbols and incremental-link files are useful CI artifacts,
          # but not runtime dependencies and add substantial release weight.
          Get-ChildItem viewer-release -Recurse -File -Include *.pdb,*.ilk,*.locked* |
            Remove-Item -Force
          .\scripts\validate-release-package.ps1 `
            -Root viewer-release `
            -Architecture ${{ matrix.arch }} `
            -PackageMode Viewer `
            -Layout Package
          Compress-Archive -Path viewer-release\* `
            -DestinationPath lvt-viewer-${{ env.RELEASE_TAG }}-x64.zip

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: lvt-${{ env.RELEASE_TAG }}-${{ matrix.arch }}.zip

      - name: Upload viewer release artifact
        if: matrix.build_viewer == 'ON'
        uses: actions/upload-artifact@v4
        with:
          name: release-viewer-x64
          path: lvt-viewer-${{ env.RELEASE_TAG }}-x64.zip

  publish:
    runs-on: ubuntu-latest
    needs: release
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          fetch-tags: true

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Extract release notes from tag
        id: notes
        run: |
          git tag -l --format='%(contents)' ${{ env.RELEASE_TAG }} > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: artifacts/*.zip
          body_path: release_notes.md
